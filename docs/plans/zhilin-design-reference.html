  background-image:

    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;div class=&quot;zl-context-bar&quot;&gt;&lt;div class=&quot;zl-breadcrumb&quot;&gt;&lt;button class=&quot;zl-link-button&quot; type=&quot;button&quot; data-go=&quot;home&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;帖子&lt;/button&gt;&lt;span&gt;/&lt;/span&gt;&lt;span&gt;正文&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;zl-link-button&quot; type=&quot;button&quot; id=&quot;zl-open-annotations&quot;&gt;&lt;i data-lucide=&quot;messages-square&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;2 条批注&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;zl-reading-grid&quot;&gt;
        &lt;article class=&quot;zl-paper&quot;&gt;
          &lt;span class=&quot;zl-tag&quot;&gt;大学篇&lt;/span&gt;
          &lt;h1 class=&quot;zl-article-title&quot;&gt;报到日，风从紫金港吹来&lt;/h1&gt;
          &lt;div class=&quot;zl-byline&quot;&gt;&lt;span class=&quot;zl-avatar&quot;&gt;柚&lt;/span&gt;&lt;span&gt;柚子&lt;/span&gt;&lt;span&gt;2026年9月5日 14:30&lt;/span&gt;&lt;span&gt;· 已编辑&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;zl-prose&quot;&gt;
            &lt;p&gt;走过螃蟹楼，宿舍区的声音渐渐清楚起来。行李箱的轮子压过砖缝，路边的帐篷一顶挨着一顶，有人举着学院的牌子，有人在树荫下等迟迟没有到来的室友。&lt;/p&gt;
            &lt;p&gt;吴晨阳还在说他的工位。笔记本带去教室，桌上再配一台台式机——他说到这里，连拖箱子的脚步都轻快了些。&lt;/p&gt;
            &lt;p&gt;&lt;button class=&quot;zl-range&quot; type=&quot;button&quot; data-annotation=&quot;one&quot; aria-pressed=&quot;false&quot;&gt;“先去宿舍吧。”林昭把手里的地图折好，“校园卡明天也能办。”&lt;/button&gt;林柚子点点头，又回头看了一眼路口。他们刚刚走过的地方，还不断有新生推着箱子进来。&lt;/p&gt;
            &lt;p&gt;到了岔路，几个人停下来对了一遍宿舍的位置。吴晨阳分在蓝田，林柚子要去紫云。地图上只隔着一小段路，真正站在这里，才发现接下来得分头走。&lt;/p&gt;
            &lt;p&gt;&lt;button class=&quot;zl-range&quot; type=&quot;button&quot; data-annotation=&quot;two&quot; aria-pressed=&quot;false&quot;&gt;项铃把一瓶还没开封的水塞进他背包侧袋，顺手把翘起来的肩带理平了。&lt;/button&gt;“安顿好了发个消息。”她说。&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;zl-discussion&quot;&gt;&lt;h2&gt;讨论 &lt;span class=&quot;zl-count&quot;&gt;3 条回复&lt;/span&gt;&lt;/h2&gt;&lt;button class=&quot;zl-button&quot; type=&quot;button&quot; data-reply-target=&quot;article&quot;&gt;回复文章&lt;/button&gt;&lt;/div&gt;
          &lt;form class=&quot;zl-thread-input&quot; data-composer=&quot;article&quot; hidden&gt;&lt;label class=&quot;zl-footnote&quot; for=&quot;zl-article-reply&quot;&gt;回复文章&lt;/label&gt;&lt;textarea id=&quot;zl-article-reply&quot; placeholder=&quot;写下你的想法&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;zl-button zl-button-primary&quot; type=&quot;submit&quot;&gt;发送回复&lt;/button&gt;&lt;/form&gt;
        &lt;/article&gt;
        &lt;aside class=&quot;zl-rail&quot; id=&quot;zl-annotations&quot; aria-label=&quot;正文批注&quot;&gt;
          &lt;div class=&quot;zl-rail-heading&quot;&gt;&lt;span&gt;正文批注&lt;/span&gt;&lt;span&gt;2 条&lt;/span&gt;&lt;/div&gt;
          &lt;article class=&quot;zl-annotation&quot; data-thread=&quot;one&quot;&gt;&lt;div class=&quot;zl-thread-meta&quot;&gt;&lt;span class=&quot;zl-avatar&quot;&gt;林&lt;/span&gt;&lt;strong&gt;林昭&lt;/strong&gt;&lt;span&gt;15:12&lt;/span&gt;&lt;/div&gt;&lt;p&gt;这里先让大家去宿舍很自然。校园卡的推销可以留一点环境声，不必展开成一整段。&lt;/p&gt;&lt;div class=&quot;zl-thread-actions&quot;&gt;&lt;button type=&quot;button&quot; data-reply-target=&quot;one&quot;&gt;回复批注&lt;/button&gt;&lt;button type=&quot;button&quot; data-locate=&quot;one&quot;&gt;定位原文&lt;/button&gt;&lt;/div&gt;&lt;form class=&quot;zl-thread-input&quot; data-composer=&quot;one&quot; hidden&gt;&lt;label class=&quot;zl-sr&quot; for=&quot;zl-reply-one&quot;&gt;回复林昭&lt;/label&gt;&lt;textarea id=&quot;zl-reply-one&quot; placeholder=&quot;回复林昭…&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;zl-button zl-button-primary&quot; type=&quot;submit&quot;&gt;发送回复&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;zl-thread-reply&quot;&gt;&lt;div class=&quot;zl-thread-meta&quot;&gt;&lt;strong&gt;柚子&lt;/strong&gt;&lt;span&gt;15:24&lt;/span&gt;&lt;/div&gt;&lt;p&gt;嗯，保留路边的热闹，把重心放回几个人身上。&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
          &lt;article class=&quot;zl-annotation&quot; data-thread=&quot;two&quot;&gt;&lt;div class=&quot;zl-thread-meta&quot;&gt;&lt;span class=&quot;zl-avatar&quot;&gt;姬&lt;/span&gt;&lt;strong&gt;姬瑕&lt;/strong&gt;&lt;span&gt;16:08&lt;/span&gt;&lt;/div&gt;&lt;p&gt;这个小动作可以留下。不用再解释她舍不得，读到这里已经能感觉到了。&lt;/p&gt;&lt;div class=&quot;zl-thread-actions&quot;&gt;&lt;button type=&quot;button&quot; data-reply-target=&quot;two&quot;&gt;回复批注&lt;/button&gt;&lt;button type=&quot;button&quot; data-locate=&quot;two&quot;&gt;定位原文&lt;/button&gt;&lt;/div&gt;&lt;form class=&quot;zl-thread-input&quot; data-composer=&quot;two&quot; hidden&gt;&lt;label class=&quot;zl-sr&quot; for=&quot;zl-reply-two&quot;&gt;回复姬瑕&lt;/label&gt;&lt;textarea id=&quot;zl-reply-two&quot; placeholder=&quot;回复姬瑕…&quot;&gt;&lt;/textarea&gt;&lt;button class=&quot;zl-button zl-button-primary&quot; type=&quot;submit&quot;&gt;发送回复&lt;/button&gt;&lt;/form&gt;&lt;/article&gt;

        &lt;article class=&quot;zl-paper&quot;&gt;&lt;label class=&quot;zl-sr&quot; for=&quot;zl-import-title&quot;&gt;帖子标题&lt;/label&gt;&lt;input class=&quot;zl-field-title&quot; id=&quot;zl-import-title&quot; value=&quot;报到日，风从紫金港吹来&quot;&gt;&lt;div class=&quot;zl-edit-tools&quot; aria-label=&quot;正文工具栏&quot;&gt;&lt;button type=&quot;button&quot; data-format=&quot;标题&quot; aria-label=&quot;标题&quot;&gt;&lt;i data-lucide=&quot;heading-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;span class=&quot;zl-separator&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; data-format=&quot;粗体&quot; aria-label=&quot;粗体&quot;&gt;&lt;i data-lucide=&quot;bold&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-format=&quot;斜体&quot; aria-label=&quot;斜体&quot;&gt;&lt;i data-lucide=&quot;italic&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-format=&quot;引用&quot; aria-label=&quot;引用&quot;&gt;&lt;i data-lucide=&quot;quote&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-format=&quot;列表&quot; aria-label=&quot;列表&quot;&gt;&lt;i data-lucide=&quot;list&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;span class=&quot;zl-separator&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; data-format=&quot;链接&quot; aria-label=&quot;链接&quot;&gt;&lt;i data-lucide=&quot;link&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-format=&quot;图片&quot; aria-label=&quot;图片&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;zl-prose&quot;&gt;&lt;p&gt;走过螃蟹楼，宿舍区的声音渐渐清楚起来。行李箱的轮子压过砖缝，路边的帐篷一顶挨着一顶，有人举着学院的牌子，有人在树荫下等迟迟没有到来的室友。&lt;/p&gt;&lt;p&gt;吴晨阳还在说他的工位。笔记本带去教室，桌上再配一台台式机——他说到这里，连拖箱子的脚步都轻快了些。&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;zl-range&quot;&gt;“先去宿舍吧。”林昭把手里的地图折好，“校园卡明天也能办。”&lt;/span&gt;林柚子点点头，又回头看了一眼路口。他们刚刚走过的地方，还不断有新生推着箱子进来。&lt;/p&gt;&lt;p&gt;到了岔路，几个人停下来对了一遍宿舍的位置。吴晨阳分在蓝田，林柚子要去紫云。地图上只隔着一小段路，真正站在这里，才发现接下来得分头走。&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;zl-range&quot;&gt;项铃把一瓶还没开封的水塞进他背包侧袋，顺手把翘起来的肩带理平了。&lt;/span&gt;“安顿好了发个消息。”她说。&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;aside class=&quot;zl-import-rail&quot; aria-label=&quot;导入检查&quot;&gt;
          &lt;section class=&quot;zl-panel&quot;&gt;&lt;h2&gt;导入检查&lt;/h2&gt;&lt;div class=&quot;zl-check-line&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;正文已解析&lt;/div&gt;&lt;div class=&quot;zl-check-line&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;2 条批注已保留&lt;/div&gt;&lt;details open&gt;&lt;summary&gt;&lt;i data-lucide=&quot;triangle-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;1 项格式提醒&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p class=&quot;zl-warning-copy&quot;&gt;页眉中的文字未导入。若属于正文，请补入后再确认。&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;

          &lt;section class=&quot;zl-panel&quot;&gt;&lt;h2&gt;正文批注 &lt;span class=&quot;zl-count&quot;&gt;2 条&lt;/span&gt;&lt;/h2&gt;&lt;div class=&quot;zl-import-annotation&quot;&gt;&lt;div class=&quot;zl-thread-meta&quot;&gt;&lt;strong&gt;林昭&lt;/strong&gt;&lt;span class=&quot;zl-origin&quot;&gt;Word 导入&lt;/span&gt;&lt;/div&gt;&lt;p&gt;这里先让大家去宿舍很自然。校园卡的推销可以留一点环境声。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;zl-import-annotation&quot;&gt;&lt;div class=&quot;zl-thread-meta&quot;&gt;&lt;strong&gt;姬瑕&lt;/strong&gt;&lt;span class=&quot;zl-origin&quot;&gt;Word 导入&lt;/span&gt;&lt;/div&gt;&lt;p&gt;这个小动作可以留下。不用再解释她舍不得。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
          &lt;p class=&quot;zl-footnote&quot;&gt;原始 DOCX 不会上传。确认后发布为新帖子，之后仍可编辑。&lt;/p&gt;

  &lt;script&gt;
    (function(){
      const root=document.getElementById(&#x27;zhilin-study&#x27;);
      const posts=[
        [&#x27;报到日，风从紫金港吹来&#x27;,&#x27;走过螃蟹楼，宿舍区的声音渐渐清楚起来。几个人到了岔路，才发现接下来得分头走。&#x27;,&#x27;柚子&#x27;,&#x27;大学篇&#x27;,&#x27;今天 14:30&#x27;,3,2,12],
        [&#x27;晚自习以后，操场的灯还亮着&#x27;,&#x27;把这一段的节奏放慢一点。并肩走回教室的路上，他们其实没有说什么重要的事情。&#x27;,&#x27;姬瑕&#x27;,&#x27;校园日常&#x27;,&#x27;昨天 21:16&#x27;,8,4,3],
        [&#x27;人物小记：那些没有说出口的话&#x27;,&#x27;一些关于人物动机的整理，也收录了讨论里几处我很喜欢的细节。&#x27;,&#x27;柚子&#x27;,&#x27;人物设定&#x27;,&#x27;9月3日&#x27;,5,3,8],
        [&#x27;把夏天留在最后一排&#x27;,&#x27;风扇转到第三档，试卷的边角被吹起来。窗外的知了声一直没有停。&#x27;,&#x27;林昭&#x27;,&#x27;短篇&#x27;,&#x27;9月2日&#x27;,2,1,5],
        [&#x27;关于大学篇开场的一点讨论&#x27;,&#x27;新生见面不一定要靠惊叹和自我介绍推进。可以让性格从一件很小的事情里露出来。&#x27;,&#x27;姬瑕&#x27;,&#x27;创作讨论&#x27;,&#x27;9月1日&#x27;,12,0,1],
        [&#x27;雨停之前，先坐一会儿&#x27;,&#x27;便利店门口只有两把椅子，他们把湿伞靠在墙边，等街上的积水慢慢退下去。&#x27;,&#x27;柚子&#x27;,&#x27;生活片段&#x27;,&#x27;8月31日&#x27;,4,2,10],
        [&#x27;寝室门牌上的名字&#x27;,&#x27;放下行李之后，空荡荡的寝室开始有了一点生活的形状。&#x27;,&#x27;林昭&#x27;,&#x27;大学篇&#x27;,&#x27;8月30日&#x27;,3,0,7],
        [&#x27;周末去哪里&#x27;,&#x27;没有安排好的下午，往往比按计划走过的路线更容易记住。&#x27;,&#x27;姬瑕&#x27;,&#x27;校园日常&#x27;,&#x27;8月29日&#x27;,6,1,2],
        [&#x27;一封写了一半的信&#x27;,&#x27;最后一句停在纸上，第二天又被轻轻划掉了。&#x27;,&#x27;柚子&#x27;,&#x27;短篇&#x27;,&#x27;8月28日&#x27;,2,0,11],
        [&#x27;章节整理：从预科到高三&#x27;,&#x27;按时间整理几篇已经完成的章节，便于之后回头查找。&#x27;,&#x27;柚子&#x27;,&#x27;创作讨论&#x27;,&#x27;8月27日&#x27;,1,0,6],
        [&#x27;走廊另一端的笑声&#x27;,&#x27;熟悉的人还没走过来，先听见了他们的声音。&#x27;,&#x27;林昭&#x27;,&#x27;生活片段&#x27;,&#x27;8月26日&#x27;,4,2,9],
        [&#x27;第一篇，写在开学之前&#x27;,&#x27;留一块地方，把这些文字和讨论慢慢放下来。&#x27;,&#x27;柚子&#x27;,&#x27;校园日常&#x27;,&#x27;8月25日&#x27;,9,0,4]
      ];
      let page=1,sort=&#x27;latest&#x27;,query=&#x27;&#x27;;
      const byId=id=&gt;root.querySelector(&#x27;#&#x27;+id);
      function notice(message){const box=byId(&#x27;zl-notice&#x27;);box.textContent=message;box.hidden=false;}
      function icons(){if(typeof lucide!==&#x27;undefined&#x27;)lucide.createIcons({attrs:{width:18,height:18}});}
      function show(view){root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(p=&gt;p.hidden=p.dataset.panel!==view);root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.view===view)));byId(&#x27;zl-notice&#x27;).hidden=true;}
      function render(){
        let rows=posts.filter(p=&gt;!query||(p[0]+p[1]+p[2]+p[3]).includes(query));
        if(sort===&#x27;active&#x27;)rows=rows.slice().sort((a,b)=&gt;a[7]-b[7]);
        const pages=Math.max(1,Math.ceil(rows.length/6));page=Math.min(page,pages);
        byId(&#x27;zl-total&#x27;).textContent=rows.length+&#x27; 篇&#x27;;
        byId(&#x27;zl-posts&#x27;).innerHTML=rows.length?rows.slice((page-1)*6,page*6).map(p=&gt;&#x27;&lt;article class=&quot;zl-post-row&quot;&gt;&lt;div&gt;&lt;button class=&quot;zl-post-title&quot; type=&quot;button&quot; data-post=&quot;&#x27;+posts.indexOf(p)+&#x27;&quot;&gt;&#x27;+p[0]+&#x27;&lt;/button&gt;&lt;p class=&quot;zl-excerpt&quot;&gt;&#x27;+p[1]+&#x27;&lt;/p&gt;&lt;div class=&quot;zl-meta&quot;&gt;&lt;span class=&quot;zl-avatar&quot;&gt;&#x27;+p[2].slice(0,1)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+p[2]+&#x27;&lt;/span&gt;&lt;span class=&quot;zl-dot&quot;&gt;·&lt;/span&gt;&lt;span&gt;&#x27;+p[4]+&#x27;&lt;/span&gt;&lt;span class=&quot;zl-tag&quot;&gt;&#x27;+p[3]+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;zl-row-activity&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;+p[5]+&#x27; 回复&lt;/span&gt;&lt;span&gt;&#x27;+p[6]+&#x27; 条批注&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&#x27;).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;zl-empty&quot;&gt;没有匹配的示例帖子，试试“大学”或“校园”。&lt;/div&gt;&#x27;;
        byId(&#x27;zl-range-label&#x27;).textContent=rows.length?&#x27;第 &#x27;+((page-1)*6+1)+&#x27;–&#x27;+Math.min(page*6,rows.length)+&#x27; 篇，共 &#x27;+rows.length+&#x27; 篇&#x27;:&#x27;0 篇&#x27;;
        byId(&#x27;zl-pages&#x27;).innerHTML=pages&gt;1?&#x27;&lt;button type=&quot;button&quot; data-page=&quot;&#x27;+(page-1)+&#x27;&quot; &#x27;+(page===1?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27; aria-label=&quot;上一页&quot;&gt;‹&lt;/button&gt;&#x27;+Array.from({length:pages},(_,i)=&gt;&#x27;&lt;button type=&quot;button&quot; data-page=&quot;&#x27;+(i+1)+&#x27;&quot; &#x27;+(page===i+1?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+(i+1)+&#x27;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;button type=&quot;button&quot; data-page=&quot;&#x27;+(page+1)+&#x27;&quot; &#x27;+(page===pages?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27; aria-label=&quot;下一页&quot;&gt;›&lt;/button&gt;&#x27;:&#x27;&#x27;;
        icons();
      }
      function selectAnnotation(id){root.querySelectorAll(&#x27;[data-thread]&#x27;).forEach(e=&gt;e.classList.toggle(&#x27;is-selected&#x27;,e.dataset.thread===id));root.querySelectorAll(&#x27;[data-annotation]&#x27;).forEach(e=&gt;e.setAttribute(&#x27;aria-pressed&#x27;,String(e.dataset.annotation===id)));}
      function openAnnotation(id){selectAnnotation(id);if(getComputedStyle(byId(&#x27;zl-annotations&#x27;)).display===&#x27;none&#x27;){const thread=root.querySelector(&#x27;[data-thread=&quot;&#x27;+id+&#x27;&quot;]&#x27;);byId(&#x27;zl-sheet-content&#x27;).innerHTML=&#x27;&lt;strong&gt;&#x27;+thread.querySelector(&#x27;strong&#x27;).textContent+&#x27;&lt;/strong&gt;&lt;p&gt;&#x27;+thread.querySelector(&#x27;p&#x27;).textContent+&#x27;&lt;/p&gt;&#x27;;byId(&#x27;zl-sheet&#x27;).showModal();}}
      root.addEventListener(&#x27;click&#x27;,event=&gt;{
        const button=event.target.closest(&#x27;button&#x27;);if(!button||!root.contains(button))return;
        if(button.dataset.view)show(button.dataset.view);
        if(button.dataset.go)show(button.dataset.go);
        if(button.dataset.notice)notice(button.dataset.notice);
        if(button.dataset.sort){sort=button.dataset.sort;page=1;root.querySelectorAll(&#x27;[data-sort]&#x27;).forEach(e=&gt;e.setAttribute(&#x27;aria-pressed&#x27;,String(e.dataset.sort===sort)));render();}
        if(button.dataset.page){page=Number(button.dataset.page);render();}
        if(button.dataset.post!==undefined){show(&#x27;reading&#x27;);if(button.dataset.post!==&#x27;0&#x27;)notice(&#x27;详情页以《报到日，风从紫金港吹来》为统一样例。&#x27;);}
        if(button.dataset.annotation)openAnnotation(button.dataset.annotation);
        if(button.dataset.locate){selectAnnotation(button.dataset.locate);const target=root.querySelector(&#x27;[data-annotation=&quot;&#x27;+button.dataset.locate+&#x27;&quot;]&#x27;);target.focus({preventScroll:true});target.scrollIntoView({block:&#x27;nearest&#x27;,behavior:&#x27;auto&#x27;});}
        if(button.dataset.replyTarget){const form=root.querySelector(&#x27;[data-composer=&quot;&#x27;+button.dataset.replyTarget+&#x27;&quot;]&#x27;);form.hidden=!form.hidden;if(!form.hidden)form.querySelector(&#x27;textarea&#x27;).focus({preventScroll:true});}
        if(button.dataset.format)notice(&#x27;样板展示“&#x27;+button.dataset.format+&#x27;”入口的位置；正式页面继续使用现有 Markdown 编辑器。&#x27;);
      });
      byId(&#x27;zl-query&#x27;).addEventListener(&#x27;input&#x27;,event=&gt;{byId(&#x27;zl-clear&#x27;).hidden=!event.target.value;});
      byId(&#x27;zl-search-form&#x27;).addEventListener(&#x27;submit&#x27;,event=&gt;{event.preventDefault();query=byId(&#x27;zl-query&#x27;).value.trim();page=1;show(&#x27;home&#x27;);render();});
      byId(&#x27;zl-clear&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{byId(&#x27;zl-query&#x27;).value=&#x27;&#x27;;byId(&#x27;zl-clear&#x27;).hidden=true;query=&#x27;&#x27;;page=1;show(&#x27;home&#x27;);render();byId(&#x27;zl-query&#x27;).focus();});
      byId(&#x27;zl-open-annotations&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{openAnnotation(&#x27;one&#x27;);if(getComputedStyle(byId(&#x27;zl-annotations&#x27;)).display!==&#x27;none&#x27;)byId(&#x27;zl-annotations&#x27;).scrollIntoView({block:&#x27;nearest&#x27;,behavior:&#x27;auto&#x27;});});
      byId(&#x27;zl-sheet-close&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;byId(&#x27;zl-sheet&#x27;).close());
      byId(&#x27;zl-mobile-search&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{const open=byId(&#x27;zl-search-form&#x27;).classList.toggle(&#x27;is-open&#x27;);byId(&#x27;zl-mobile-search&#x27;).setAttribute(&#x27;aria-expanded&#x27;,String(open));if(open)byId(&#x27;zl-query&#x27;).focus();});
      byId(&#x27;zl-rechoose&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;notice(&#x27;重新选文件会返回紧凑的文件选择步骤；当前是导入预览样板。&#x27;));
      byId(&#x27;zl-import-confirm&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;notice(&#x27;这里只预览布局，未创建帖子或上传文件。&#x27;));
      root.querySelectorAll(&#x27;[data-composer]&#x27;).forEach(form=&gt;form.addEventListener(&#x27;submit&#x27;,event=&gt;{event.preventDefault();notice(&#x27;回复仅用于体验输入区布局，未发送任何内容。&#x27;);}));
      render();
    })();
  &lt;/script&gt;
